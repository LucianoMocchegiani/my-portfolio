<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/luciano.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Web site created using create-react-app" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/luciano.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Luciano Mocchegiani</title>

    <!-- Google Translate Widget -->
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({
          pageLanguage: 'en',
          autoDisplay: false
        }, 'google_translate_element');
      }
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <!-- Custom CSS to Hide Google Translate Elements -->
    <style type="text/css">
      /* Hide the specific elements added by Google Translate */
      .goog-te-banner-frame {
        display: none !important;
      }
      .goog-te-menu-frame {
        display: none !important;
      }
      .goog-te-gadget {
        display: none !important;
      }
      .goog-te-gadget-simple {
        display: none !important;
      }
      .goog-te-menu2, .goog-te-menu2 * {
        display: none !important;
      }
      .goog-te-gadget-simple {
        display: none !important;
      }
      .goog-te-banner-frame, .goog-te-menu-frame, .goog-te-gadget, .goog-te-gadget-simple, .goog-te-menu2 {
        display: none !important;
      }
      /* Hide specific translation messages */
      .goog-te-banner-frame {
        display: none !important;
      }
      .goog-te-gadget {
        display: none !important;
      }
      .goog-te-gadget-simple {
        display: none !important;
      }
      .goog-te-menu2 {
        display: none !important;
      }
      body {
        top: 0px !important;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <div id="google_translate_element" style="display:none;"></div>
  </body>
</html>
